<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Простой калькулятор</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      padding: 20px; background: #f1f5f9; color: #0f172a;
      font: 16px/1.4 system-ui, sans-serif;
    }
    .calculator {
      width: min(100%, 340px); padding: 20px; border-radius: 20px;
      background: white; box-shadow: 0 16px 40px #0f172a1a;
    }
    h1 { margin: 0 0 16px; font-size: 1.35rem; }
    #display {
      width: 100%; height: 72px; margin-bottom: 14px; padding: 12px;
      border: 1px solid #cbd5e1; border-radius: 12px; background: #f8fafc;
      text-align: right; font: 2rem/1.2 ui-monospace, monospace;
    }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    button {
      min-height: 56px; border: 0; border-radius: 12px; background: #e2e8f0;
      color: inherit; font: 600 1.2rem system-ui, sans-serif; cursor: pointer;
    }
    button:hover { filter: brightness(.96); }
    button:active { transform: scale(.97); }
    .operator { background: #dbeafe; color: #1d4ed8; }
    .clear { background: #fee2e2; color: #b91c1c; }
    .equals { grid-row: span 2; background: #2563eb; color: white; }
    .zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>Калькулятор</h1>
    <output id="display" aria-live="polite">0</output>
    <div class="keys" aria-label="Кнопки калькулятора">
      <button class="clear" data-action="clear">C</button>
      <button data-action="sign">±</button>
      <button data-action="percent">%</button>
      <button class="operator" data-operator="÷">÷</button>
      <button data-digit="7">7</button><button data-digit="8">8</button>
      <button data-digit="9">9</button><button class="operator" data-operator="×">×</button>
      <button data-digit="4">4</button><button data-digit="5">5</button>
      <button data-digit="6">6</button><button class="operator" data-operator="−">−</button>
      <button data-digit="1">1</button><button data-digit="2">2</button>
      <button data-digit="3">3</button><button class="operator" data-operator="+">+</button>
      <button class="zero" data-digit="0">0</button><button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </main>
  <script>
    const display = document.querySelector("#display");
    let current = "0";
    let stored = null;
    let operator = null;
    let replaceCurrent = false;

    function show(value) {
      current = String(value);
      display.textContent = current;
    }

    function enterDigit(digit) {
      if (replaceCurrent || current === "Ошибка") {
        show(digit);
        replaceCurrent = false;
      } else if (current === "0") {
        show(digit);
      } else if (current.replace("-", "").replace(".", "").length < 12) {
        show(current + digit);
      }
    }

    function calculate() {
      if (operator === null || stored === null) return;
      const a = stored;
      const b = Number(current);
      let result;
      if (operator === "+") result = a + b;
      if (operator === "−") result = a - b;
      if (operator === "×") result = a * b;
      if (operator === "÷") result = b === 0 ? NaN : a / b;
      if (!Number.isFinite(result)) {
        show("Ошибка");
      } else {
        show(Number(result.toPrecision(10)));
      }
      stored = null;
      operator = null;
      replaceCurrent = true;
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      if (button.dataset.operator) {
        if (operator && !replaceCurrent) calculate();
        stored = Number(current);
        operator = button.dataset.operator;
        replaceCurrent = true;
      }
      if (button.dataset.action === "clear") {
        stored = null; operator = null; replaceCurrent = false; show("0");
      }
      if (button.dataset.action === "decimal" && current !== "Ошибка") {
        if (replaceCurrent) { show("0."); replaceCurrent = false; }
        else if (!current.includes(".")) show(current + ".");
      }
      if (button.dataset.action === "sign" && current !== "Ошибка") {
        show(String(Number(current) * -1));
      }
      if (button.dataset.action === "percent" && current !== "Ошибка") {
        show(String(Number(current) / 100));
      }
      if (button.dataset.action === "equals") calculate();
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") document.querySelector('[data-action="decimal"]').click();
      else if (event.key === "Escape") document.querySelector('[data-action="clear"]').click();
      else if (event.key === "Enter" || event.key === "=") document.querySelector('[data-action="equals"]').click();
      else if (["+", "-", "*", "/"].includes(event.key)) {
        const symbol = { "+": "+", "-": "−", "*": "×", "/": "÷" }[event.key];
        document.querySelector('[data-operator="' + symbol + '"]').click();
      } else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
